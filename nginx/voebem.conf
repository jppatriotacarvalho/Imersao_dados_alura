# Site do VoeBem + ponte para o servidor do agente.
# O navegador só fala com este nginx. As chaves ficam no contêiner "api".
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        # Resolve o nome "api" na hora do pedido (DNS interno do Docker).
        # Assim o site abre mesmo se o contêiner do agente estiver desligado.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8000;
        proxy_pass $api;
        proxy_read_timeout 180s;
        client_max_body_size 4k;
    }

    # O navegador sempre confere se o site mudou (evita ver CSS/JS antigos).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ =404;
    }
}
